<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="application-name" content="Workspace"><title>Admin | Promo Kings Workspace</title><link rel="icon" href="images/promo-kings-logo.svg"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/polish.css"></head>
<body>
  <header id="app-header" class="topbar"></header>
  <main class="page">
    <div class="page-heading"><div><p class="eyebrow">ADMIN WORKSPACE</p><h1>Tracker overview</h1><p class="muted">Manage artwork requests.</p></div></div>
    <section class="panel"><div class="section-heading"><h2>My activity</h2><label class="inline-label">Period<select id="admin-period"><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option></select></label></div><div id="admin-tallies" class="stats-grid"></div></section>
    <section class="panel"><div class="section-heading"><h2>All artwork</h2><button id="export-csv" class="secondary">Export filtered CSV</button></div>
      <div class="filter-grid"><select id="filter-sales"><option value="">All salespeople</option></select><select id="filter-designer"><option value="">All designers</option></select><select id="filter-status"><option value="">All statuses</option><option>Requested</option><option>In progress</option><option>Change requested</option><option>Done</option></select><select id="filter-category"><option value="">All categories</option><option>New client</option><option>Old client</option></select><input id="filter-from" type="date" aria-label="Created from"><input id="filter-to" type="date" aria-label="Created to"><input id="admin-search" placeholder="Ref no or client"></div>
      <div class="table-wrap"><table><thead><tr><th data-sort="ref_no">Ref no</th><th>Client</th><th>Reference</th><th>Salesperson</th><th>Designer preferred</th><th>Category</th><th>Product</th><th>Branding</th><th>Created</th><th>Needed</th><th>Status</th><th>Manage</th></tr></thead><tbody id="admin-rows"></tbody></table></div><p id="admin-empty" class="empty-state hidden">No requests match these filters.</p>
    </section>
  </main>
  <dialog id="admin-edit-dialog"><form id="admin-edit-form" method="dialog"><div class="section-heading"><h2>Edit artwork</h2><button type="button" class="icon-button" data-close-dialog aria-label="Close">×</button></div>
    <input type="hidden" name="id"><div class="form-grid">
      <label>Reference<input name="ref_no" readonly></label><label>SR<input name="sr" readonly></label>
      <label>Category<select name="category"><option>New client</option><option>Old client</option></select></label>
      <label>Client<input name="client_name" required></label>
      <label>Reference<input name="display_reference" readonly></label>
      <label>Reference type<select name="reference_type"><option value="">Legacy entry</option><option value="new">New artwork</option><option value="old">Old artwork</option></select></label>
      <label data-previous-reference-field>Previous artwork reference no<input name="previous_reference"></label>
      <div class="line-field-label"><span>Product with code and colour</span><div class="line-field-slot" data-line-slot="product"></div></div>
      <div class="line-field-label"><span>Branding</span><div class="line-field-slot" data-branding-slot="branding_details"></div></div>
      <label>Designer preferred<select name="preferred_designer"></select></label>
      <label>Currently assigned<select name="assigned_designer"></select></label>
      <label>Status<select name="status"><option>Requested</option><option>In progress</option><option>Change requested</option><option>Done</option></select></label>
      <label>Needed date<input name="date_needed" type="date" required></label>
      <label class="check-line"><input name="high_res_logo" type="checkbox"> High resolution logo</label>
      <label class="check-line"><input name="redesign_logo" type="checkbox"> Redesign logo</label>
      <label class="wide">Additional information<textarea name="additional_info"></textarea></label>
      <label class="wide">Work notes / final file<textarea name="designer_notes"></textarea></label>
    </div><div class="dialog-actions"><button type="button" class="danger" id="admin-delete" data-shortcut-remove>Delete artwork</button><button class="primary" type="submit">Save changes</button></div></form></dialog>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="config.js"></script><script src="js/logo.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="js/app.js"></script>
</body>
</html>
