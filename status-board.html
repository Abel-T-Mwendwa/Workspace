<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="application-name" content="Workspace"><title>Status board | Promo Kings Workspace</title><link rel="icon" href="images/promo-kings-logo.svg"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/polish.css"></head>
<body class="status-board-page">
  <header id="app-header" class="topbar"></header>
  <main class="page status-board-page">
    <div class="page-heading status-board-heading">
      <div class="status-board-title"><h1>Status board</h1><span class="status-board-info" title="Deliveries, artwork and rider jobs update here automatically. Read only." aria-label="Deliveries, artwork and rider jobs update here automatically. Read only.">?</span></div>
      <div class="status-board-tabs" role="tablist" aria-label="Status board sections">
        <button type="button" role="tab" id="status-tab-deliveries" aria-controls="status-panel-deliveries" aria-selected="true">Deliveries</button>
        <button type="button" role="tab" id="status-tab-artworks" aria-controls="status-panel-artworks" aria-selected="false" tabindex="-1">Artworks</button>
        <button type="button" role="tab" id="status-tab-riders" aria-controls="status-panel-riders" aria-selected="false" tabindex="-1">Riders</button>
      </div>
      <div class="status-board-heading-controls">
        <span id="status-board-updated" class="muted" aria-live="polite">Updated --:--</span>
        <button type="button" class="secondary" id="status-board-refresh">Refresh</button>
      </div>
    </div>
    <section id="status-panel-deliveries" role="tabpanel" aria-labelledby="status-tab-deliveries">
      <section class="status-board-summary" id="status-board-summary" aria-label="Delivery summary">
        <div id="status-board-stage-tabs" class="status-board-stage-tabs" role="group" aria-label="Delivery stages"></div>
      </section>
      <section class="panel status-board-filters">
        <div class="status-board-filter-row">
          <label>Search<input id="status-board-search" type="search" placeholder="SR, reference, SO, client or salesperson"></label>
          <label>Salesperson<select id="status-board-salesperson"><option value="">All salespeople</option></select></label>
          <label>From<input id="status-board-date-from" type="date"></label>
          <label>To<input id="status-board-date-to" type="date"></label>
          <button type="button" class="secondary" data-date-range="today">Today</button>
          <button type="button" class="secondary" data-date-range="week">Last 7 days</button>
          <button type="button" class="secondary" data-date-range="month">This month</button>
          <button type="button" class="secondary" id="status-board-reset">Reset</button>
          <p id="status-board-date-count" class="muted" aria-live="polite"></p>
        </div>
      </section>
      <div id="status-board-kanban" class="status-board-kanban" aria-label="Delivery requests by stage"></div>
    </section>
    <section id="status-panel-artworks" class="hidden" role="tabpanel" aria-labelledby="status-tab-artworks" hidden></section>
    <section id="status-panel-riders" class="hidden" role="tabpanel" aria-labelledby="status-tab-riders" hidden></section>
  </main>
  <dialog id="status-board-dialog" class="status-board-dialog">
    <div class="section-heading"><h2 id="status-board-dialog-title">Delivery timeline</h2><button type="button" class="icon-button" data-status-dialog-close aria-label="Close">×</button></div>
    <div id="status-board-timeline"></div>
    <div class="dialog-actions"><button type="button" class="primary" data-status-dialog-close>Close</button></div>
  </dialog>
  <dialog id="status-board-table-dialog" class="status-board-table-dialog" aria-labelledby="status-board-table-title">
    <div class="status-board-table-dialog-content">
      <div class="section-heading status-board-table-dialog-heading">
        <h2 id="status-board-table-dialog-heading">Delivery table</h2>
        <button type="button" class="icon-button" data-status-table-close aria-label="Close">×</button>
      </div>
      <div class="status-board-table-dialog-toolbar">
        <div id="status-board-table-filters" class="status-board-table-filters" role="group" aria-label="Filter table rows"></div>
        <div class="dialog-actions status-board-table-actions">
          <button type="button" class="secondary" id="status-board-table-print">Print / Save as PDF</button>
          <button type="button" class="quiet" data-status-table-close>Close</button>
        </div>
      </div>
      <section id="status-board-table-printable">
        <header class="status-board-table-print-header">
          <h2 id="status-board-table-title"></h2>
          <p id="status-board-table-range"></p>
          <p id="status-board-table-total"></p>
          <p id="status-board-table-printed"></p>
        </header>
        <div class="table-wrap" id="status-board-table-wrap">
          <table class="status-board-table">
            <thead><tr><th>SO number</th><th>Salesperson</th><th>Client</th><th>Items</th><th>Goods status</th><th>Production</th><th>Dispatch</th></tr></thead>
            <tbody id="status-board-table-body"></tbody>
          </table>
        </div>
        <p id="status-board-table-empty" class="empty-state hidden">Nothing here</p>
      </section>
    </div>
  </dialog>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="js/app.js"></script>
</body>
</html>
