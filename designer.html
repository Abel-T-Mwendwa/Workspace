<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="application-name" content="Workspace"><title>Design | Promo Kings Workspace</title><link rel="icon" href="images/promo-kings-logo.svg"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/polish.css"></head>
<body>
  <header id="app-header" class="topbar"></header>
  <main class="page">
    <div class="page-heading"><div><p class="eyebrow">DESIGN WORKSPACE</p><h1>Work queue</h1><p class="muted">Claim a job to start work and keep its sales team informed.</p></div></div>
    <section class="panel"><div class="section-heading"><h2>My activity</h2><label class="inline-label">Period<select id="designer-period"><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option></select></label></div><div id="designer-tallies" class="stats-grid"></div></section>
    <section class="panel designer-search-panel" aria-label="Search artwork queue"><div class="designer-search-control"><input id="designer-search" type="search" placeholder="Write reference no or client name" aria-label="Search reference number or client name"><button id="designer-search-clear" class="icon-button hidden" type="button" aria-label="Clear search">×</button></div></section>
    <section class="panel"><div class="section-heading"><h2>Artwork queue</h2><select id="designer-filter"><option value="">All jobs</option><option value="today">Needed today</option><option value="tomorrow">Needed tomorrow</option><option value="pending">Pending</option><option value="done">Done</option><option value="changes">Change requests</option><option value="assignments">New assignments</option></select></div>
      <div id="assignment-banner" class="notice assignment-notice hidden"></div>
      <div id="change-banner" class="notice hidden"></div>
      <div class="table-wrap"><table><thead><tr><th data-sort="ref_no">Ref / client</th><th>Reference</th><th data-sort="date_needed">Needed</th><th>Request details</th><th>Salesperson</th><th>Status</th><th>Change requested</th><th>Work notes / final file</th><th>Designer preferred</th><th>Actions</th></tr></thead><tbody id="designer-rows"></tbody></table></div>
      <p id="designer-empty" class="empty-state hidden">No jobs match this filter.</p>
    </section>
  </main>
  <dialog id="designer-change-dialog" class="designer-change-dialog" role="dialog" aria-modal="true" aria-labelledby="designer-change-title">
    <div class="designer-change-heading"><h2 id="designer-change-title">Change request</h2><button id="designer-change-close" class="icon-button" type="button" aria-label="Close">×</button></div>
    <div id="designer-change-text" class="designer-change-body" tabindex="-1"></div>
  </dialog>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="config.js"></script><script src="js/logo.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="js/app.js"></script>
</body>
</html>
